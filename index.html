<!DOCTYPE html>
<html>
<head>
<style>
   body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

       .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
   .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        
  .input-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

#urlInput {
    width: 500px;
    max-width: 100%;
}

#checkButton {
    width: 120px;
}

        #checkButton {
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            background: #4267e8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
</style>
  <title>URL安全性チェッカー</title>
</head>
<body>
  <h1>URLに危険なところがないか確かめます</h1>
  <p> <input type="text" placeholder="https://">
    <button onclick="checkUrl()">チェック</button>
    <p id="result"></p>
<script>
function checkUrl() {
    const url = document.getElementById("urlInput").value;
　　document.getElementById("result").textContent =
        "入力されたURL：" + url;
}
</script>
</body>
</html>
