<!DOCTYPE html>
<html>
<head>
<style>
   body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

       .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
   .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        
  .input-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

#urlInput {
    width: 500px;
    padding: 10px;
}

#checkButton {
    width: 120px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #4267e8;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
</style>
  <title>URL安全性チェッカー</title>
</head>
<body>
   <h1>URLに危険なところがないか確かめます</h1></p>

    <div class="input-area">
      <input id="urlInput" type="text" placeholder="https://">
      <button id="checkButton" onclick="checkUrl()">チェック</button>
    </div>

    <p id="result"></p>

  </div>

<script>
   function checkUrl() {
    const input = document.getElementById("urlInput").value;

    try {
        const url = new URL(input);
        console.log("URL全体:", url.href);
        console.log("通信方式:", url.protocol);
        console.log("ドメイン:", url.hostname);
        console.log("ポート:", url.port);
        console.log("パス:", url.pathname);
        console.log("パラメータ:", url.search);
    } catch (error) {
        console.log("URLとして正しくありません");
    }
}
</script>
</body>
</html>
