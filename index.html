   <body>

      <div id="selfcheckScreen" style="display: none;">

    <div class="container">

<script>

   // 画面切り替え
function switchScreen(screen) {

    const checkerScreen = document.getElementById("checkerScreen");
    const selfcheckScreen = document.getElementById("selfcheckScreen");

    const buttons = document.querySelectorAll(".nav-button");

    if (screen === "checker") {

        checkerScreen.style.display = "block";
        selfcheckScreen.style.display = "none";

        buttons[0].classList.add("active");
        buttons[1].classList.remove("active");

    } else {

        checkerScreen.style.display = "none";
        selfcheckScreen.style.display = "block";

        buttons[0].classList.remove("active");
        buttons[1].classList.add("active");

    }
}

   // セルフチェック
function checkSelfCheck() {

    const checks = document.querySelectorAll(".risk-check");

    let count = 0;

    checks.forEach(check => {

        if (check.checked) {
            count++;
        }

    });

    let result = "";
    let message = "";

    if (count <= 1) {

        result = "注意点は少ないようです";

        message =
            "チェックされた特徴は少ないですが、安全を保証するものではありません。";

    } else if (count <= 3) {

        result = "注意が必要です";

        message =
            "複数の注意点があります。個人情報や支払い情報を入力する前に、サイトの信頼性を確認してください。";

    } else {

        result = "危険である可能性が高いです";

        message =
            "多くの注意点が見つかりました。利用を避け、個人情報や支払い情報を入力しないことをおすすめします。";

    }

    document.getElementById("selfcheckResult").innerHTML = `

        <div class="warning-box">

            <h2>${result}</h2>

            <h3>チェック数：${count} / ${checks.length}</h3>

            <p>${message}</p>

            <p>
                ※この結果は目安であり、サイトの安全性を保証するものではありません。
            </p>

        </div>

    `;

}

   // 国民生活センターの悪質通販サイト情報
// 2026年6月17日時点の掲載ドメイン
const reportedDomains = [
    "cpi.reduceee.ink",
    "czwuh.pouchera.shop",

    "apjajmq.equiteck.ru.com",

    "pedrojapanonline.com",

    "summer.starji.sa.com",
    "srhcq.hockeystay.club",
    "cutvrfuel.com",
    "rope.chukani.com",
    "icebugjapan.top",
    "juicycouture-japan.com",
    "digital.kidone.shop",
    "rbmc.senorawooly.com",
    "cooddyee.com",
    "toms-japan.jp",
    "ewjiq.famousmeans.shop",
    "qppxel.fungameg.shop",
    "gdraqf.gdclaz.shop",
    "xilm.wingsbiotechllp.com",
    "letqzgolf.live",
    "nmnrv.qimine.com",
    "blackdiamondstores.shop",
    "everlane-japan.com",
    "fjallravenjapan.com"
];

   // HTML表示時の文字列を安全にする
function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
   
async function checkUrl() {
    let input = document.getElementById("urlInput").value.trim();

    // URLが空だった場合
    if (input === "") {
        document.getElementById("result").textContent =
            "URLを入力してください";
        return;
    }

    let safetyResult;
    let a = 0;
    let warnings = [];
    let url;
    let reasons = [];

    try {
        // URLを読み取る
      　url = new URL(input);

       // 公的機関の掲載履歴を確認
const hostname = url.hostname.toLowerCase();

const matchedDomain = reportedDomains.find(domain =>
    hostname === domain ||
    hostname.endsWith("." + domain)
);

if (matchedDomain) {
    a++;

    warnings.push(
        "過去に国民生活センターの悪質通販サイト一覧に掲載されたドメインです"
    );

    reasons.push(
        "このドメインは過去に公表された悪質通販サイト情報に掲載されています。現在のサイトの状態や運営者が同じとは限りません。"
    );
}

        // ポート番号
        const port =
            url.port || (url.protocol === "https:" ? 443 : 80);

        // 安全性をチェック

        if (url.protocol === "http:") {
            a++;
            warnings.push("HTTPSではありません");
           reasons.push(
           "通信が暗号化されないため、通信内容を第三者に見られたり改ざんされたりする可能性があります。"
           );
        }

        if (url.protocol === "javascript:") {
            a++;
            warnings.push("javascript形式のURLです");
           reasons.push(
           "URLを開く操作でJavaScriptが実行される形式のため、悪意あるコードに利用される可能性があります。"
           );
        }

        if (url.protocol === "data:") {
            a++;
            warnings.push("data形式のURLです");
           reasons.push(
           "URLの中にデータを直接埋め込む形式で、意図しない内容を表示させるために使われる場合があります。"
           );
        }
       
        if (url.username || url.password) {
            a++;
            warnings.push("URLにユーザー名かパスワードが含まれています");
           reasons.push(
           "本当の接続先を分かりにくくするために悪用される場合があります。"
           );
        }

        if (input.includes("@") || input.includes("＠")) {
           a++;
           warnings.push("URLに「＠」が含まれています");
           reasons.push(
           "URLの「@」より前がユーザー情報として扱われる場合があり、正規のドメインを偽装する手口に使われることがあります。"
           );
        }

        // -------------------------
        // Cloudflare URL Scanner
        // -------------------------

        document.getElementById("result").innerHTML = `
            <h2>確認中です...</h2>
            <h4>URLの安全性を確認しています</h4>
            <h4>結果が出るまで時間がかかる場合があります</h4>
        `;

        // WorkerにURLを送る
        // WorkerにURLを送る
const response = await fetch(
    "https://url-checker-api.natuhuyu1672.workers.dev/",
    {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            url: input
        })
    }
);

const scanData = await response.json();

console.log("Workerの結果:", scanData);

if (!response.ok || scanData.status !== "finished") {
    throw new Error(
        scanData.message || "URLの確認に失敗しました"
    );
}


// URLhausの結果//////////
const urlhaus = scanData.urlhaus;

// HTML解析の結果
const html = scanData.html;

// HTML解析ができたか
const htmlUnavailable = html?.status !== "checked";
const htmlRedirect = html?.status === "redirect";

// HTML解析で見つかった特徴
if (html?.status === "checked") {

    if (html.hasPassword) {
        warnings.push("ページ内にパスワード入力欄があります");
        reasons.push(
            "パスワード入力欄が存在します。信頼できるサイトか確認してから入力してください。"
        );
    }

    if (html.hasEmail) {
        warnings.push("ページ内にメールアドレス入力欄があります");
        reasons.push(
            "メールアドレスを入力する欄があります。個人情報の送信先を確認してください。"
        );
    }

    if (html.hasTelephone) {
        warnings.push("ページ内に電話番号入力欄があります");
        reasons.push(
            "電話番号を入力する欄があります。個人情報の送信先を確認してください。"
        );
    }

    if (html.hasIframe) {
        warnings.push("ページ内にiframeが使用されています");
        reasons.push(
            "別のページやコンテンツを埋め込むiframeが使用されています。"
        );
    }

    if (html.hasExternalForm) {
        warnings.push("外部サイトへ送信するフォームがあります");
        reasons.push(
            "入力した情報が別のドメインへ送信される可能性があります。送信先を確認してください。"
        );
    }
}

// URLhausの確認状況
// テスト用：URLhausに接続できなかった状態を再現
const unavailable = urlhaus?.status !== "checked";

// URLhausで危険情報が見つかった場合
if (urlhaus?.status === "checked" && urlhaus.found === true) {
    a++;

    warnings.push("URLhausで危険なURLとして登録されています");

    reasons.push(
        "マルウェアに関連するURLとしてURLhausに登録されています。"
    );
}

// 最終結果
if (a > 0) {
    safetyResult = "危険である可能性があります";
} else if (unavailable) {
    safetyResult = "一部の確認ができませんでした";
} else {
    safetyResult = "危険情報は見つかりませんでした";
}



// 画面に表示
document.getElementById("result").innerHTML = `
    <h2>${safetyResult}</h2>
    ${
    html?.status === "checked"
    ? `
        <div class="analysis-box">
    <h3>HTML解析結果</h3>

            <p>パスワード入力欄：
                ${html.hasPassword ? "⚠ 検出あり" : "✓ 検出なし"}
            </p>

            <p>メールアドレス入力欄：
                ${html.hasEmail ? "⚠ 検出あり" : "✓ 検出なし"}
            </p>

            <p>電話番号入力欄：
                ${html.hasTelephone ? "⚠ 検出あり" : "✓ 検出なし"}
            </p>

            <p>iframe：
                ${html.hasIframe ? "⚠ 検出あり" : "✓ 検出なし"}
            </p>

            <p>外部サイトへのフォーム送信：
                ${html.hasExternalForm ? "⚠ 検出あり" : "✓ 検出なし"}
            </p>

            <p>※検出された特徴だけで危険なサイトとは限りません。</p>
        </div>
    `
    : ""
}
    ${
    html?.title
    ? `<h4>ページタイトル：${escapeHtml(html.title)}</h4>`
    : ""
}

    ${
        warnings.length > 0 || unavailable || htmlUnavailable
        ? `<div class="warning-box">
            <h3>⚠ 注意点 ⚠</h3>

            ${
                warnings.length > 0
                ? `<h4>${warnings.join("<br>")}</h4>
                   <h3>注意が必要な理由</h3>
                   <p>${reasons.join("<br><br>")}</p>`
                : ""
            }

            ${
                unavailable
                ? `<p>一部のデータベースに接続できず、確認できませんでした。</p>`
                : ""
            }
            ${
    htmlUnavailable
    ? htmlRedirect
        ? `<p>リダイレクトが発生したため、HTML解析を中止しました。</p>`
        : `<p>ページのHTML解析ができませんでした。サイトにアクセスできない、または解析対象外の可能性があります。</p>`
    : ""
}
        </div>`
        : ""
    }
`;
        
        } catch (error) {

            console.error("外部データベースの確認に失敗しました:", error);

            // 外部データベースで失敗しても、自作チェックの結果を表示する
            if (url) {

                if (a === 0) {
                    safetyResult = "外部データベースで判定できませんでした";
                } else {
                    safetyResult = "危険である可能性があります";
                }

                document.getElementById("result").innerHTML = `
                    <h2>${safetyResult}</h2>

                    ${
                        warnings.length > 0
                        ? `<div class="warning-box">
                            <h3>⚠ 注意点 ⚠</h3>
                            <h4>${warnings.join("<br>")}</h4>
                            <h3>注意が必要な理由</h3>
                            <p>${reasons.join("<br><br>")}</p>
                           </div>`
                        : ""
                    }
                `;

            } else {

                document.getElementById("result").textContent =
                    "URLの形式を確認してください";

            }
        }
    }
</script>
