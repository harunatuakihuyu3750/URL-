<!DOCTYPE html>
<html>
<head>
<style>
   body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

       .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
   .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }
  
   h1 {
            text-align: center;
            margin-bottom: 4px;
   }

        
  .input-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

#urlInput {
    width: 500px;
    padding: 10px;
}

#checkButton {
    width: 120px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #4267e8;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
</style>
  <title>URL安全性チェッカー</title>
</head>
<body>
   <h1>URLに危険なところがないか確かめます</h1></p>
   <h2>結果はURLのみを見ているため違う可能性があります</h2></p>

    <div class="input-area">
      <input id="urlInput" type="text" placeholder="https://">
      <button id="checkButton" onclick="checkUrl()">チェック</button>
    </div>

    <p id="result"></p>

  </div>

<script>
function checkUrl() {
    let input = document.getElementById("urlInput").value.trim();

    // URLが空だった場合
    if (input === "") {
        document.getElementById("result").textContent =
            "URLを入力してください";
        return;
    }

    // https:// や http:// がなければ https:// を追加
    if (!input.startsWith("http://") && !input.startsWith("https://")) {
        input = "https://" + input;
    }

    try {
        // URLを読み取る
        const url = new URL(input);

        // ポート番号
        const port = url.port || (url.protocol === "https:" ? 443 : 80);

        // 安全性をチェック
        let safetyResult;

        if (url.protocol === "https:") {
            safetyResult = " 危険は見つかりませんでした";
        } else {
            safetyResult = " 危険である可能性があります";
        }

        // 画面に表示
        document.getElementById("result").innerHTML = `
            <h2>${safetyResult}</h2>
            <p>URL全体：${url.href}</p>
            <p>通信方式：${url.protocol}</p>
            <p>WEB名：${url.hostname}</p>
            <p>通信サービス：${port}</p>
            <p>WEB内のページ：${url.pathname}</p>
            <p>追加情報：${url.search || "なし"}</p>
        `;

    } catch (error) {
        document.getElementById("result").textContent =
            " URLとして正しくありません。もう一度入力してください";
    }
}
</script>
</body>
</html>
