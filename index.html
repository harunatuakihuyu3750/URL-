<!DOCTYPE html>
<html>
<head>
<style>
   body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

       .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
   .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        
  .input-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

#urlInput {
    width: 500px;
    padding: 10px;
}

#checkButton {
    width: 120px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #4267e8;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
</style>
  <title>URL安全性チェッカー</title>
</head>
<body>
   <h1>URLに危険なところがないか確かめます</h1></p>

    <div class="input-area">
      <input id="urlInput" type="text" placeholder="https://">
      <button id="checkButton" onclick="checkUrl()">チェック</button>
    </div>

    <p id="result"></p>

  </div>

<script>
  function checkUrl() {
    const input = document.getElementById("urlInput").value;

    try {
        const url = new URL(input);

        document.getElementById("result").innerHTML = `
            <p>URL全体：${url.href}</p>
            <p>通信方式：${url.protocol}</p>
            <p>ドメイン：${url.hostname}</p>
            <p>通信サービス：${url.port || 443}</p>
            <p>パス：${url.pathname}</p>
            <p>追加情報：${url.search || なし}</p>
        `;

    } catch (error) {
        document.getElementById("result").textContent =
            "URLとして正しくありません";
    }
}
</script>
</body>
</html>
