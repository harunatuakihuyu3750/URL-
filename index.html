<!DOCTYPE html>
<html>
<head>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
   body {
       margin: 0;
       padding: 40px 20px;
       font-family: Arial, sans-serif;
       background: linear-gradient(135deg, #0b1220, #172b4d);
       color: #222;
        }

   .description {
     text-align: center;
      color: #666;
      margin-bottom: 30px;
        }

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    box-sizing: border-box;
}

   h1 {
    text-align: center;
    margin-bottom: 4px;
   color: #172b4d;
　}

    h2  {
    text-align: center;
    margin-bottom: 4px;
   color: #172b4d;
    white-space: nowrap;
   font-size: 50px;
   }

    h3 {
    text-align: center;
    margin-bottom: 0;
   color: #b45309;
   font-size: 40px;
    white-space: nowrap;
}

h4 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 4px;
    font-size: 25px;
    white-space: nowrap;
}
.input-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }

   #urlInput {
    width: 500px;
    max-width: 100%;
    padding: 10px;
    box-sizing: border-box;
      border-radius: 8px;
}

  #checkButton {
    width: 120px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #4267e8;
    color: white;
    font-size: 16px;
    cursor: pointer;
     box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
  }
   #checkButton:hover {
    background: #5579f0;
}
   
   #result {
    margin-top: 30px;
    text-align: left;
    width: 700px;
    max-width: 100%;
    margin-left: auto;
    margin-right: auto;
   }
  
   #result p {
    margin: 12px 0;
}
   .warnings {
    text-align: center;
    font-weight: bold;
    margin-top: 0;
    font-size: 16px;
}
 
.warning-box {
    background: #fff4e5;
    border: 1px solid #f5c28b;
    border-radius: 12px;
    padding: 16px;
    margin: 20px 0;
    box-sizing: border-box;
}


    @media (max-width: 600px) {

    .input-area {
        flex-direction: column;
        width: 100%;
    }

    #urlInput {
        width: 100%;
    }

    #checkButton {
        width: 100%;
    }
      .warnings {
        font-size: 14px;
    }
       h2 {
        font-size: 20px;
    }
       h3 {
        font-size: 20px;
    }
       h4 {
        font-size: 12px;
    }

}
#result p {
    overflow-wrap: break-word;
    line-height: 1.6;
}
   .label {
    white-space: nowrap;
}
</style>
  <title>URLチェッカーver１</title>
</head>
<body>
   <div class="container">

    <h1>URLに危険なところがないか確かめます</h1>

    <p class="description">
     安全を保障するものではありません
    </p>

    <div class="input-area">
      <input id="urlInput" type="text" placeholder="https://" onkeydown="if(event.key === 'Enter') checkUrl()">
      <button id="checkButton" onclick="checkUrl()">チェック</button>
    </div>

    <div id="result"></div>

  </div>

<script>
async function checkUrl() {
    let input = document.getElementById("urlInput").value.trim();

    // URLが空だった場合
    if (input === "") {
        document.getElementById("result").textContent =
            "URLを入力してください";
        return;
    }

    let safetyResult;
    let a = 0;
    let warnings = [];
    let url;
    let reasons = [];

    try {
        // URLを読み取る
      　url = new URL(input);

        // ポート番号
        const port =
            url.port || (url.protocol === "https:" ? 443 : 80);

        // 安全性をチェック

        if (url.protocol === "http:") {
            a++;
            warnings.push("HTTPSではありません");
           reasons.push(
           "通信が暗号化されないため、通信内容を第三者に見られたり改ざんされたりする可能性があります。"
           );
        }

        if (url.protocol === "javascript:") {
            a++;
            warnings.push("javascript形式のURLです");
           reasons.push(
           "URLを開く操作でJavaScriptが実行される形式のため、悪意あるコードに利用される可能性があります。"
           );
        }

        if (url.protocol === "data:") {
            a++;
            warnings.push("data形式のURLです");
           reasons.push(
           "URLの中にデータを直接埋め込む形式で、意図しない内容を表示させるために使われる場合があります。"
           );
        }
       
        if (url.username || url.password) {
            a++;
            warnings.push("URLにユーザー名かパスワードが含まれています");
           reasons.push(
           "本当の接続先を分かりにくくするために悪用される場合があります。"
           );
        }

        if (input.includes("@") || input.includes("＠")) {
           a++;
           warnings.push("URLに「＠」が含まれています");
           reasons.push(
           "URLの「@」より前がユーザー情報として扱われる場合があり、正規のドメインを偽装する手口に使われることがあります。"
           );
        }

        // -------------------------
        // Cloudflare URL Scanner
        // -------------------------

        document.getElementById("result").innerHTML = `
            <h2>確認中です...</h2>
            <h4>URLの安全性を確認しています</h4>
            <h4>結果が出るまで時間がかかる場合があります</h4>
        `;

        // WorkerにURLを送る
        const response = await fetch(
            "https://url-checker-api.natuhuyu1672.workers.dev/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    url: input
                })
            }
        );

        const scanData = await response.json();

        // Worker側でエラーが起きた場合
        if (!response.ok) {
            throw new Error(
                scanData.error || "スキャン開始に失敗しました"
            );
        }

        const scanId = scanData.scan_id;

        if (!scanId) {
            throw new Error("scan_idを取得できませんでした");
        }

        // -------------------------
        // スキャン結果を待つ
        // -------------------------

        let resultData = null;

        for (let i = 0; i < 15; i++) {

            // 2秒待つ
            await new Promise(resolve =>
                setTimeout(resolve, 2000)
            );

            const resultResponse = await fetch(
                "https://url-checker-api.natuhuyu1672.workers.dev/?scan_id="
                + encodeURIComponent(scanId)
            );

            resultData = await resultResponse.json();

            // スキャン完了
            if (resultData.status === "finished") {
                break;
            }
        }

        // 15回確認しても終わらなかった場合
        if (!resultData || resultData.status !== "finished") {
            document.getElementById("result").innerHTML = `
                <h3>⚠ 確認できませんでした ⚠</h3>
                <h4>スキャンに時間がかかっています。<br>
                もう一度試してください。</h4>
            `;
            return;
        }

        // -------------------------
        // Cloudflareの判定
        // -------------------------

        const cloudflareDanger = resultData.malicious === true;

        if (cloudflareDanger) {
            a++;
            warnings.push(
                "Cloudflareのスキャンで危険なURLと判定されました"
            );
        }

        // -------------------------
        // 最終結果
        // -------------------------

        if (a === 0) {
            safetyResult = "危険は見つかりませんでした";
        } else {
            safetyResult = "危険である可能性があります";
        }

        // -------------------------
        // 画面に表示
        // -------------------------

        
        document.getElementById("result").innerHTML = `
            <h2>${safetyResult}</h2>

            
        ${
           warnings.length > 0
           ? `<div class="warning-box">
              <h3>⚠ 注意点 ⚠</h3>
              <h4>${warnings.join("<br>")}</h4>
              <h3>注意が必要な理由</h3>
              <p>${reasons.join("<br><br>")}</p>
          </div>`
         : ""
       }


            `;
       
        } catch (error) {

        console.error("Cloudflareの確認に失敗しました:", error);

        // Cloudflareで失敗しても、自作チェックの結果を表示する
        if (url) {
            if (a === 0) {
                safetyResult = "危険は見つかりませんでした";
            } else {
                safetyResult = "危険である可能性があります";
            }

            
        document.getElementById("result").innerHTML = `
            <h2>${safetyResult}</h2>

            ${
                warnings.length > 0
              
               ? `<div class="warning-box">
               <h3>⚠ 注意点 ⚠</h3>
               <h4>${warnings.join("<br>")}</h4>
               <h3>注意が必要な理由</h3>
               <p>${reasons.join("<br><br>")}</p>
               </div>`
                : ""
            }

            `;
           
       } else {
            document.getElementById("result").textContent =
                "URLの形式を確認してください";
        }
    }


}
</script>
</body>
</html>
