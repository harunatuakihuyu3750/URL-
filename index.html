<!DOCTYPE html>
<html>
<head>
<style>
   body {
       margin: 0;
       padding: 40px 20px;
       font-family: Arial, sans-serif;
        background: #f4f6f8;
       color: #222;
        }

   .description {
     text-align: center;
      color: #666;
      margin-bottom: 30px;
        }
   .container {
     max-width: 900px;
      margin: 0 auto;
   }

   h1 {
    text-align: center;
    margin-bottom: 4px;
　}

    h2  {
    text-align: center;
    margin-bottom: 4px;
   color:#cc0000
   }

    h3 {
    text-align: center;
    margin-bottom: 0;
   color:#e6e600
}

h4 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 4px;
}
.input-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }

   #urlInput {
    width: 500px;
    padding: 10px;
  }

  #checkButton {
    width: 120px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #4267e8;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
   #result {
    margin-top: 30px;
    text-align: left;
    width: 700px;
    max-width: 100%;
    margin-left: auto;
    margin-right: auto;
   }
</style>
  <title>URL安全性チェッカー</title>
</head>
<body>
   <div class="container">

    <h1>URLに危険なところがないか確かめます</h1>

    <p class="description">
      結果はURLのみを見ているため違う可能性があります
    </p>

    <div class="input-area">
      <input id="urlInput" type="text" placeholder="https://" onkeydown="if(event.key === 'Enter') checkUrl()">
      <button id="checkButton" onclick="checkUrl()">チェック</button>
    </div>

    <div id="result"></div>

  </div>

<script>
function checkUrl() {
    let input = document.getElementById("urlInput").value.trim();

    // URLが空だった場合
    if (input === "") {
        document.getElementById("result").textContent =
            "URLを入力してください";
        return;
   }

        let safetyResult;
        let a = 0;
        let warnings = [];

　　　 // javascript: のチェック
　　　if (input.toLowerCase().startsWith("javascript:")) {
　　　    a++;
　　　    warnings.push("javascript形式のURLです");
　　　}

　　　// data: のチェック
　　　if (input.toLowerCase().startsWith("data:")) {
　　　    a++;
　　　    warnings.push("data形式のURLです");
　　　}
   
    try {
        // URLを読み取る
        const url = new URL(input);

        // ポート番号
        const port = url.port || (url.protocol === "https:" ? 443 : 80);

        // 安全性をチェック


       if(url.protocol === "http:"){
          a = a+1;
          warnings.push("HTTPSではありません");
       }
       if(url.username || url.password){
          a = a+1;
          warnings.push("URLにユーザー名かパスワードが含まれています");
       }
       if(input.includes("@")){
          a = a+1;
          warnings.push("URLに「＠」が含まれています");
       }
       

        if (a == 0) {
            safetyResult = " 危険は見つかりませんでした";
        } else{
            safetyResult = " 危険である可能性があります";
        }

       

        // 画面に表示
        document.getElementById("result").innerHTML = `
    　　　　<h2>${safetyResult}</h2>
            ${
        　　　　warnings.length > 0
       　　　　 ? `<h3>⚠ 注意点 ⚠</h3>
          　　 <h4>${warnings.join("<br>")}</h4> ` 
        　　　　: ""
  　　　　　  }
            <p>URL全体：${url.href}</p>
            <p>通信方式：${url.protocol}</p>
            <p>WEB名：${url.hostname}</p>
            <p>通信サービス：${port}</p>
            <p>WEB内のページ：${url.pathname}</p>
            <p>追加情報：${url.search || "なし"}</p>
        `;

    } catch (error) {
        document.getElementById("result").textContent =
            " URLとして正しくありません。もう一度入力してください";
    }
}
</script>
</body>
</html>
