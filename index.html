<!DOCTYPE html>
<html>
<head>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
   body {
       margin: 0;
       padding: 40px 20px;
       font-family: Arial, sans-serif;
        background: #f4f6f8;
       color: #222;
        }

   .description {
     text-align: center;
      color: #666;
      margin-bottom: 30px;
        }
   .container {
     max-width: 900px;
      margin: 0 auto;
   }

   h1 {
    text-align: center;
    margin-bottom: 4px;
　}

    h2  {
    text-align: center;
    margin-bottom: 4px;
   color:#cc0000;
    white-space: nowrap;
   font-size: 50px;
   }

    h3 {
    text-align: center;
    margin-bottom: 0;
   color:#e6c300;
   font-size: 40px;
    white-space: nowrap;
}

h4 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 4px;
    font-size: 25px;
    white-space: nowrap;
}
.input-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }

   #urlInput {
    width: 500px;
    max-width: 100%;
    padding: 10px;
    box-sizing: border-box;
}

  #checkButton {
    width: 120px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #4267e8;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
   #result {
    margin-top: 30px;
    text-align: left;
    width: 700px;
    max-width: 100%;
    margin-left: auto;
    margin-right: auto;
   }
  
   #result p {
    margin: 12px 0;
}
   .warnings {
    text-align: center;
    font-weight: bold;
    margin-top: 0;
    font-size: 16px;
}

    @media (max-width: 600px) {

    .input-area {
        flex-direction: column;
        width: 100%;
    }

    #urlInput {
        width: 100%;
    }

    #checkButton {
        width: 100%;
    }
      .warnings {
        font-size: 14px;
    }
       h2 {
        font-size: 20px;
    }
       h3 {
        font-size: 20px;
    }
       h4 {
        font-size: 12px;
    }

}
#result p {
    overflow-wrap: anywhere;
}
   .label {
    white-space: nowrap;
}
</style>
  <title>URLチェッカーver１</title>
</head>
<body>
   <div class="container">

    <h1>URLに危険なところがないか確かめます</h1>

    <p class="description">
      結果はURLのみを見ているため違う可能性があります
    </p>

    <div class="input-area">
      <input id="urlInput" type="text" placeholder="https://" onkeydown="if(event.key === 'Enter') checkUrl()">
      <button id="checkButton" onclick="checkUrl()">チェック</button>
    </div>

    <div id="result"></div>

  </div>

<script>
<script>
async function checkUrl() {
    let input = document.getElementById("urlInput").value.trim();

    // URLが空だった場合
    if (input === "") {
        document.getElementById("result").textContent =
            "URLを入力してください";
        return;
    }

    let safetyResult;
    let a = 0;
    let warnings = [];

    // javascript: のチェック
    if (input.toLowerCase().startsWith("javascript:")) {
        a++;
        warnings.push("javascript形式のURLです");
    }

    // data: のチェック
    if (input.toLowerCase().startsWith("data:")) {
        a++;
        warnings.push("data形式のURLです");
    }

    try {
        // URLを読み取る
        const url = new URL(input);

        // ポート番号
        const port =
            url.port || (url.protocol === "https:" ? 443 : 80);

        // 安全性をチェック

        if (url.protocol === "http:") {
            a++;
            warnings.push("HTTPSではありません");
        }

        if (url.username || url.password) {
            a++;
            warnings.push(
                "URLにユーザー名かパスワードが含まれています"
            );
        }

        if (input.includes("@")) {
            a++;
            warnings.push("URLに「＠」が含まれています");
        }

        // -------------------------
        // Cloudflare URL Scanner
        // -------------------------

        document.getElementById("result").innerHTML = `
            <h2>確認中です...</h2>
            <h4>URLの安全性を確認しています</h4>
        `;

        // WorkerにURLを送る
        const response = await fetch(
            "https://url-checker-api.natuhuyu1672.workers.dev/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    url: input
                })
            }
        );

        const scanData = await response.json();

        // Worker側でエラーが起きた場合
        if (!response.ok) {
            throw new Error(
                scanData.error || "スキャン開始に失敗しました"
            );
        }

        const scanId = scanData.scan_id;

        if (!scanId) {
            throw new Error("scan_idを取得できませんでした");
        }

        // -------------------------
        // スキャン結果を待つ
        // -------------------------

        let resultData = null;

        for (let i = 0; i < 15; i++) {

            // 2秒待つ
            await new Promise(resolve =>
                setTimeout(resolve, 2000)
            );

            const resultResponse = await fetch(
                "https://url-checker-api.natuhuyu1672.workers.dev/?scan_id="
                + encodeURIComponent(scanId)
            );

            resultData = await resultResponse.json();

            // スキャン完了
            if (resultData.status === "finished") {
                break;
            }
        }

        // 15回確認しても終わらなかった場合
        if (!resultData || resultData.status !== "finished") {
            document.getElementById("result").innerHTML = `
                <h3>⚠ 確認できませんでした ⚠</h3>
                <h4>スキャンに時間がかかっています。<br>
                もう一度試してください。</h4>
            `;
            return;
        }

        // -------------------------
        // Cloudflareの判定
        // -------------------------

        const cloudflareDanger = resultData.malicious === true;

        if (cloudflareDanger) {
            a++;
            warnings.push(
                "Cloudflareのスキャンで危険なURLと判定されました"
            );
        }

        // -------------------------
        // 最終結果
        // -------------------------

        if (a === 0) {
            safetyResult = "危険は見つかりませんでした";
        } else {
            safetyResult = "危険である可能性があります";
        }

        // -------------------------
        // 画面に表示
        // -------------------------

        document.getElementById("result").innerHTML = `
            <h2>${safetyResult}</h2>

            ${
                warnings.length > 0
                ? `<h3>⚠ 注意点 ⚠</h3>
                   <h4>${warnings.join("<br>")}</h4>`
                : ""
            }

            <p>通信方式：${url.protocol}</p>
            <p>WEB名：${url.hostname}</p>
            <p>通信サービス：${port}</p>
            <p>
                <span class="label">WEB内のページ：</span>
                ${url.pathname}
            </p>
            <p>追加情報：${url.search || "なし"}</p>
        `;

    } catch (error) {

        console.error(error);

        document.getElementById("result").innerHTML = `
            <h3>確認中にエラーが発生しました</h3>
            <h4>もう一度試してください</h4>
        `;
    }
}
</script>
</script>
</body>
</html>
